server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 10
    mbeanregistry:
      enabled: true
    max-connections: 8192
    accept-count: 100
    uri-encoding: UTF-8
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  forward-headers-strategy: framework
spring:
  lifecycle:
    timeout-per-shutdown-phase: 10s
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 2KB
  mvc:
    async:
      request-timeout: -1

url:
  frontend: ${FRONTEND_URL}
  backend: ${API_SERVER_URL}

rate-limit:
  ai:
    search:
      limit: 10
      window-seconds: 3600


management:
  endpoints:
    web:
      exposure:
        include: ["health", "info", "metrics", "jolokia"]
  endpoint:
    jolokia:
      enabled: true
    heapdump:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}